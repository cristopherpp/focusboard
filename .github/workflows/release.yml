name: Draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches project version
        shell: bash
        run: |
          version=$(sed -nE 's/^project\(Focusboard VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          pattern: focusboard-*-package*
          merge-multiple: true
          path: artifacts
      - name: Create or update the draft with tested Linux and Windows packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json; then
            test "$(jq -r .isDraft release-state.json)" = true || {
              echo "Refusing to modify an already published release." >&2
              exit 1
            }
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            # A failed lookup never edits another release; create fails safely
            # if an existing release could not be read.
            gh release create "$GITHUB_REF_NAME" artifacts/* --draft --verify-tag --generate-notes
          fi
