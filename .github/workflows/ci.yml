name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Git before checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Trust and verify GitHub workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify Git checkout
        run: |
          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - name: Install declared build and validation tools
        run: |
          pacman -S --noconfirm --needed base-devel cmake ninja \
            qt6-base qt6-declarative qt6-wayland qt6-svg layer-shell-qt \
            ttf-dejavu desktop-file-utils namcap util-linux
      - name: Build, test, and lint
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel 2
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ctest --test-dir build --output-on-failure
          /usr/lib/qt6/bin/qmllint -I build qml/Main.qml qml/components/*.qml
          desktop-file-validate build/focusboard.desktop
          # --check is supported by git diff and git show. Handle shallow and
          # root commits without relying on the invalid `git diff --root` flag.
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Verify staged installation
        run: |
          stage=$(mktemp -d)
          DESTDIR="$stage" cmake --install build
          test -x "$stage/usr/bin/focusboard"
          test -f "$stage/usr/share/applications/focusboard.desktop"
          test -f "$stage/usr/share/icons/hicolor/scalable/apps/focusboard.svg"
          test -f "$stage/usr/share/icons/hicolor/16x16/apps/focusboard.png"
          grep -qx 'Exec=focusboard' "$stage/usr/share/applications/focusboard.desktop"
          grep -qx 'Icon=focusboard' "$stage/usr/share/applications/focusboard.desktop"
          ! readelf -d "$stage/usr/bin/focusboard" | grep -E 'RPATH|RUNPATH'
          find "$stage" -type f | sort
      - name: Build Arch package without root
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -c 'cd packaging/aur/focusboard-git && bash -n PKGBUILD && diff -u .SRCINFO <(makepkg --printsrcinfo)'
          runuser -u builder -- ./scripts/install-arch.sh --prepare-only
          stage=$(find build-arch -mindepth 1 -maxdepth 1 -type d -name 'package.*' -print -quit)
          test -n "$stage"
          runuser -u builder -- bash -c 'cd "$1" && makepkg --verifysource && makepkg --packagelist && makepkg --noconfirm' bash "$stage"
          package=$(find "$stage" -maxdepth 1 -name 'focusboard-*.pkg.tar.zst' -print -quit)
          test -n "$package"
          pacman -Qlp "$package"
          pacman -Qlp "$package" | grep -q 'usr/bin/focusboard$'
          pacman -Qlp "$package" | grep -q 'usr/share/icons/hicolor/scalable/apps/focusboard.svg$'
          namcap "$stage/PKGBUILD" "$package"
          mkdir -p release-artifacts
          cp "$package" release-artifacts/
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: focusboard-arch-package
          path: release-artifacts/*.pkg.tar.zst
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure Release
        run: cmake -S . -B build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build-windows --parallel 2
      - name: Run shared and Windows tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ctest --test-dir build-windows --output-on-failure
      - name: Ensure Inno Setup is available
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Deploy, verify, package, and measure
        run: ./scripts/package-windows.ps1
      - name: Test installer and uninstaller on the disposable runner
        run: |
          $version = (Get-Content build-windows/version.txt -Raw).Trim()
          ./scripts/test-windows-installer.ps1 -SetupExe release-artifacts/Focusboard-Setup-x64.exe -Version $version -MeasurementsFile "release-artifacts/Focusboard-$version-measurements.json"
      - uses: actions/upload-artifact@v4
        with:
          name: focusboard-windows-packages
          path: release-artifacts/*
          if-no-files-found: error

  publish-prebuilt:
    needs: [arch, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: focusboard-prebuilt
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: focusboard-windows-packages
          path: artifacts
      - name: Validate packages and prepare metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(Focusboard VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)
          python3 scripts/publish-prebuilt.py artifacts published "$version" "$GITHUB_SHA"
      - name: Publish one orphan commit to prebuilt
        shell: bash
        run: |
          set -euo pipefail
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote_main" = "$GITHUB_SHA" || { echo 'A newer main commit exists; refusing stale publication.' >&2; exit 1; }
          git -C published init -q
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published add -- Focusboard-Setup-x64.exe Focusboard-Portable-x64.zip latest.json SHA256SUMS.txt
          git -C published commit -qm "Prebuilt Focusboard $GITHUB_SHA"
          git -C published remote add origin "$(git remote get-url origin)"
          # checkout's credential is scoped to its local Git config; carry it
          # into this temporary repository without committing or printing it.
          git -C published config --local http.https://github.com/.extraheader "$(git config --local --get http.https://github.com/.extraheader)"
          git -C published push --force origin HEAD:refs/heads/prebuilt
          echo "Published Focusboard $(python3 -c 'import json; print(json.load(open("published/latest.json"))["version"])') from $GITHUB_SHA"

  smoke-prebuilt-install:
    needs: publish-prebuilt
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install, inspect, repeat, and uninstall published package
        shell: pwsh
        run: |
          ./scripts/install-windows.ps1 -Status
          ./scripts/install-windows.ps1
          ./scripts/install-windows.ps1 -Update
          ./scripts/install-windows.ps1 -Uninstall
          if (Test-Path "$env:LOCALAPPDATA\Programs\Focusboard\Focusboard.exe") { throw 'Uninstall left the application executable' }
